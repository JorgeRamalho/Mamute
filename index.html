<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg?v=monogram" />
    <link rel="apple-touch-icon" href="./public/logo-mamute.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mamute DJPLAYER é o mixer player para DJs iniciantes e avançados: visor digital, simulador de CDJ e controladora, academia, rádio e catálogo Beatport, Deezer, SoundCloud, YouTube e Spotify."
    />
    <meta
      name="keywords"
      content="Mamute DJPLAYER, Mamute, DJ, mixer player, CDJ, controladora, beatmatching, Beatport, Deezer, SoundCloud, YouTube, Spotify, academia DJ, rádio eletrônica"
    />
    <meta name="author" content="Mamute DJPLAYER" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06070c" />
    <link rel="canonical" href="https://mamutedjplayerm.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mamute DJPLAYER" />
    <meta property="og:title" content="Mamute DJPLAYER — Mixer player para DJs" />
    <meta
      property="og:description"
      content="Do primeiro beat ao peak time. Visor digital, CDJ virtual, sala de aula e rádio para DJs."
    />
    <meta property="og:image" content="./public/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mamute DJPLAYER — Mixer player para DJs" />
    <meta name="twitter:image" content="./public/og.jpg" />
    <meta
      name="twitter:description"
      content="Simulador de CDJ, academia e rádio para DJs iniciantes e avançados."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;800&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="./public/mamute-mascot.png" fetchpriority="high" />
    <title>Mamute DJPLAYER — Mixer player para DJs iniciantes e avançados</title>
  </head>
  <body>
    <form name="mamute-cadastro" data-netlify="true" hidden>
      <input type="text" name="fullName" />
      <input type="text" name="artistName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="city" />
      <input type="text" name="country" />
      <textarea name="bio"></textarea>
      <input type="text" name="experienceLevel" />
    </form>
    <div id="root"></div>
    <script>
      (function () {
        var VISOR_BPM = 124;
        var BEAT_MS = 60000 / VISOR_BPM;
        var TICKER_BEATS = 192;
        document.documentElement.style.setProperty("--visor-bpm", String(VISOR_BPM));
        document.documentElement.style.setProperty(
          "--ticker-duration",
          (TICKER_BEATS * BEAT_MS) / 1000 + "s",
        );

        var rate = 1;
        var target = 1;
        var tau = 0.62;
        var last = performance.now();

        function tick(now) {
          var dt = Math.min(0.048, (now - last) / 1000);
          last = now;
          rate += (target - rate) * (1 - Math.exp(-dt / tau));
          if (target === 0 && rate < 0.02) rate = 0;
          var track = document.querySelector(".status-track");
          if (track) {
            var anims = track.getAnimations();
            for (var i = 0; i < anims.length; i += 1) {
              anims[i].playbackRate = rate;
            }
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        document.addEventListener(
          "pointerover",
          function (event) {
            var node = event.target;
            if (node && node.closest && node.closest(".status-bar")) {
              target = 0;
              tau = 0.62;
            }
          },
          true,
        );

        document.addEventListener(
          "pointerout",
          function (event) {
            var from = event.target && event.target.closest ? event.target.closest(".status-bar") : null;
            var to =
              event.relatedTarget && event.relatedTarget.closest
                ? event.relatedTarget.closest(".status-bar")
                : null;
            if (from && !to) {
              target = 1;
              tau = 0.95;
            }
          },
          true,
        );
      })();

      (function () {
        var port = String(location.port || "");
        if (/^517\d$/.test(port) || port === "4173") return;
        if (document.querySelector('script[src*="dist/assets/main.js"]')) return;
        if (document.querySelector('script[src="./assets/main.js"]')) return;

        var VITE_ORIGIN = "http://127.0.0.1:5173";
        var CSS_HREF = "./dist/assets/index.css";
        var JS_HREF = "./dist/assets/main.js";
        var MAX_TRIES = 8;
        var TRY_MS = 400;

        function showHint() {
          var root = document.getElementById("root");
          if (!root) return;
          if (root.childElementCount && !root.querySelector("[data-live-wait]")) return;
          root.innerHTML =
            '<section style="font-family:Outfit,sans-serif;color:#e8eef8;padding:2.5rem;max-width:42rem;margin:12vh auto;background:#0c1018;border:1px solid rgba(0,232,255,.35);border-radius:18px;line-height:1.5"><p style="color:#ff2d95;letter-spacing:.24em;font-size:.7rem">MAMUTE DJPLAYER</p><h1 style="font-family:Syne,sans-serif">O index.html não é a app</h1><p>Este arquivo só carrega o React. Para ver academia, mixer e EQ ao vivo, rode <code>npm run dev</code> e abra <a href="http://127.0.0.1:5173/" style="color:#00e8ff">http://127.0.0.1:5173/</a>. O Go Live na porta 5500 usa o último <code>npm run build</code> em <code>dist/</code> — sem rebuild a página fica desatualizada.</p></section>';
        }

        function showWait() {
          var root = document.getElementById("root");
          if (!root || (root.childElementCount && !root.querySelector("[data-live-wait]"))) return;
          root.innerHTML =
            '<p data-live-wait style="font-family:Outfit,sans-serif;color:#9bb0c9;padding:2.5rem;text-align:center">Atualizando o bundle do Live Server…</p>';
        }

        function bust(href) {
          return href + "?t=" + Date.now();
        }

        function isRealAsset(type, text) {
          if (!text || /^\s*</.test(text)) return false;
          if (/html/i.test(type || "")) return false;
          return text.length > 20;
        }

        function inject(cssHref, jsHref) {
          var css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = cssHref;
          css.onerror = showHint;
          document.head.appendChild(css);

          var script = document.createElement("script");
          script.type = "module";
          script.src = jsHref;
          script.onerror = showHint;
          document.body.appendChild(script);
        }

        function tryLoadDist(attempt) {
          var cssHref = bust(CSS_HREF);
          var jsHref = bust(JS_HREF);
          fetch(jsHref, { cache: "no-store" })
            .then(function (res) {
              return res.text().then(function (text) {
                return { res: res, text: text };
              });
            })
            .then(function (part) {
              var type = part.res.headers.get("content-type") || "";
              if (part.res.ok && isRealAsset(type, part.text)) {
                inject(cssHref, jsHref);
                return;
              }
              if (attempt < MAX_TRIES) {
                if (attempt === 1) showWait();
                setTimeout(function () {
                  tryLoadDist(attempt + 1);
                }, TRY_MS);
                return;
              }
              showHint();
            })
            .catch(function () {
              if (attempt < MAX_TRIES) {
                if (attempt === 1) showWait();
                setTimeout(function () {
                  tryLoadDist(attempt + 1);
                }, TRY_MS);
                return;
              }
              showHint();
            });
        }

        function livePath() {
          var path = location.pathname.replace(/\/index\.html$/i, "") || "/";
          return path + location.search + location.hash;
        }

        var settled = false;
        function goDist() {
          if (settled) return;
          settled = true;
          tryLoadDist(1);
        }
        function goVite() {
          if (settled) return;
          settled = true;
          location.replace(VITE_ORIGIN + livePath());
        }

        var viteTimer = setTimeout(goDist, 600);

        fetch(VITE_ORIGIN + "/src/main.tsx", { cache: "no-store", mode: "cors" })
          .then(function (res) {
            if (!res.ok) throw new Error("vite off");
            clearTimeout(viteTimer);
            goVite();
          })
          .catch(function () {
            clearTimeout(viteTimer);
            goDist();
          });
                      })();
    </script>
  </body>
</html>
